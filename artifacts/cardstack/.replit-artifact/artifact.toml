kind = "web"
previewPath = "/"
title = "CardStack"
version = "1.0.0"
id = "artifacts/cardstack"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22165

[services.development]
run = "pnpm --filter @workspace/cardstack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cardstack", "run", "build" ]
publicDir = "artifacts/cardstack/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22165"
BASE_PATH = "/"
